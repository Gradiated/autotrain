name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - torch: "2.7.1"
            transformers: "4.53.3"
            peft: "0.16.0"
            safetensors: "0.5.3"
          - torch: "2.13.0"
            transformers: "5.17.0"
            peft: "0.21.2"
            safetensors: "0.8.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==${{ matrix.transformers }} peft==${{ matrix.peft }} safetensors==${{ matrix.safetensors }}
      - run: pip install .
      - run: python -m unittest discover -s tests
  tests-passed:
    name: Tests passed
    runs-on: ubuntu-latest
    needs: cpu
    if: ${{ always() }}
    steps:
      - name: Require every CPU matrix job to succeed
        env:
          CPU_RESULT: ${{ needs.cpu.result }}
        run: test "$CPU_RESULT" = success
