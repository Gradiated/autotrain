[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradiated-autotrain"
version = "0.1.0"
description = "Completion-only supervised fine-tuning with resumable LoRA checkpoints"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7.1,<3",
    "transformers>=4.53.3,<6",
    "peft>=0.16.0,<1",
    "accelerate==1.9.0",
    "safetensors>=0.5.3,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
